<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🏆 Grammar Master Pro</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;900&family=Orbitron:wght@400;700;900&family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-user-select:none;-moz-user-select:none;-ms-user-select;user-select:none;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none;outline:none;}
input,textarea{-webkit-user-select:text;user-select:text;}
img,a,button,*{-webkit-touch-callout:none;}
body{
  font-family:'Cairo',sans-serif;
  background: 
    linear-gradient(rgba(5,5,16,0.7), rgba(5,5,16,0.85)),
    url('A.jpg') center/cover no-repeat fixed;
  min-height:100vh;
  color:#fff;
  overflow-x:hidden;
  position:relative;
}


/* === Prevent blue highlight & selection === */
*::selection{background:transparent;color:inherit;}
*::-moz-selection{background:transparent;color:inherit;}
*:focus{outline:none;}
button,input,div,span,a{-webkit-tap-highlight-color:transparent;touch-action:manipulation;}
input::selection{background:rgba(255,215,0,0.3);color:#fff;}

/* === Scrollbar === */
::-webkit-scrollbar{width:6px;}
::-webkit-scrollbar-track{background:rgba(255,255,255,0.02);}
::-webkit-scrollbar-thumb{background:linear-gradient(180deg,#667eea,#f093fb);border-radius:3px;}

/* === Variables === */
:root{
--p:#667eea;--s:#764ba2;--a:#f093fb;--g:#ffd700;
--ok:#00e676;--er:#ff5252;
--glass:rgba(255,255,255,0.04);
--gb:rgba(255,255,255,0.08);
}

/* === Animated BG === */
.bg{position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none;}
.bg::before{content:'';position:absolute;inset:-50%;background:radial-gradient(circle at 20% 30%,rgba(102,126,234,0.08),transparent 40%),radial-gradient(circle at 80% 70%,rgba(240,147,251,0.06),transparent 40%),radial-gradient(circle at 50% 50%,rgba(118,75,162,0.05),transparent 50%);animation:bgMove 20s ease-in-out infinite;}
@keyframes bgMove{0%,100%{transform:translate(0,0) scale(1);}50%{transform:translate(-20px,-30px) scale(1.05);}}

.ptcl{position:absolute;width:2px;height:2px;background:#fff;border-radius:50%;opacity:0;animation:ptclAnim var(--d,8s) linear infinite;}
@keyframes ptclAnim{0%{opacity:0;transform:translateY(100vh) scale(0);}10%{opacity:.6;}90%{opacity:.6;}100%{opacity:0;transform:translateY(-10vh) scale(1);}}

.orb{position:absolute;border-radius:50%;filter:blur(80px);opacity:.3;animation:orbF 15s ease-in-out infinite;}
@keyframes orbF{0%,100%{transform:translate(0,0);}33%{transform:translate(40px,-50px);}66%{transform:translate(-30px,30px);}}

.grid-lines{position:absolute;inset:0;background-image:linear-gradient(rgba(102,126,234,0.03) 1px,transparent 1px),linear-gradient(90deg,rgba(102,126,234,0.03) 1px,transparent 1px);background-size:60px 60px;animation:gridM 30s linear infinite;}
@keyframes gridM{to{background-position:60px 60px;}}

/* === Main === */
.app{position:relative;z-index:10;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:15px;}

/* === Glass Card === */
.card{background:var(--glass);backdrop-filter:blur(30px) saturate(1.5);-webkit-backdrop-filter:blur(30px) saturate(1.5);border:1px solid var(--gb);border-radius:28px;padding:35px;box-shadow:0 20px 60px rgba(0,0,0,0.5),inset 0 1px 0 rgba(255,255,255,0.06),0 0 0 1px rgba(255,255,255,0.02);position:relative;overflow:hidden;width:100%;max-width:900px;animation:cardIn .7s cubic-bezier(.175,.885,.32,1.275);}
@keyframes cardIn{from{opacity:0;transform:translateY(40px) scale(.95);}to{opacity:1;transform:translateY(0) scale(1);}}

.card::before{content:'';position:absolute;top:0;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,rgba(255,255,255,0.15),transparent);}
.card::after{content:'';position:absolute;top:-50%;left:-50%;width:200%;height:200%;background:conic-gradient(from 0deg,transparent,rgba(102,126,234,0.03),transparent,rgba(240,147,251,0.03),transparent);animation:cardGlow 10s linear infinite;pointer-events:none;}
@keyframes cardGlow{to{transform:rotate(360deg);}}

/* === Title === */
.ttl{font-family:'Orbitron',sans-serif;font-size:2em;font-weight:900;text-align:center;margin-bottom:6px;background:linear-gradient(135deg,var(--g),#fff,var(--g),var(--a));background-size:400% 400%;-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;animation:ttlSh 4s ease infinite;position:relative;}
@keyframes ttlSh{0%,100%{background-position:0% 50%;}50%{background-position:100% 50%;}}
.sub{text-align:center;color:rgba(255,255,255,0.4);margin-bottom:25px;letter-spacing:3px;font-size:.85em;text-transform:uppercase;}

/* === Section Label === */
.sec{font-size:1.1em;font-weight:700;margin:20px 0 12px;display:flex;align-items:center;gap:10px;color:rgba(255,255,255,0.85);}
.sec svg{width:22px;height:22px;fill:var(--g);animation:secPulse 2s infinite;}
@keyframes secPulse{0%,100%{transform:scale(1);}50%{transform:scale(1.15);}}

/* === Buttons Grid === */
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px;margin-top:12px;}
.b{background:linear-gradient(135deg,rgba(102,126,234,0.12),rgba(118,75,162,0.12));border:1px solid rgba(102,126,234,0.2);border-radius:18px;padding:22px 14px;color:#fff;font-family:'Tajawal',sans-serif;font-size:.95em;font-weight:700;cursor:pointer;transition:all .35s cubic-bezier(.175,.885,.32,1.275);position:relative;overflow:hidden;display:flex;flex-direction:column;align-items:center;gap:8px;backdrop-filter:blur(10px);}
.b::before{content:'';position:absolute;inset:0;background:linear-gradient(135deg,rgba(255,255,255,0.05),transparent);opacity:0;transition:opacity .3s;}
.b:hover::before{opacity:1;}
.b:hover{transform:translateY(-6px) scale(1.03);border-color:var(--g);box-shadow:0 15px 40px rgba(102,126,234,0.3),0 0 30px rgba(255,215,0,0.1);}
.b:active{transform:translateY(-2px) scale(.98);}
.b.sel{background:linear-gradient(135deg,rgba(255,215,0,0.2),rgba(255,140,0,0.15));border-color:var(--g);box-shadow:0 0 30px rgba(255,215,0,0.2);}
.b .ic{width:42px;height:42px;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,rgba(102,126,234,0.2),rgba(240,147,251,0.15));border-radius:12px;padding:8px;transition:all .3s;}
.b:hover .ic{transform:scale(1.1) rotate(-5deg);background:linear-gradient(135deg,rgba(255,215,0,0.2),rgba(255,140,0,0.15));}
.b .ic svg{width:26px;height:26px;fill:#fff;}
.b .tx{font-size:.95em;text-align:center;}
.b .st{font-size:.7em;opacity:.5;font-weight:400;letter-spacing:1px;}

/* === Tooltip === */
.tp{position:absolute;bottom:-38px;left:50%;transform:translateX(-50%) scale(0);background:rgba(0,0,0,0.95);color:var(--g);padding:5px 12px;border-radius:8px;font-size:.7em;white-space:nowrap;transition:transform .3s;border:1px solid rgba(255,215,0,0.3);z-index:100;pointer-events:none;}
.b:hover .tp{transform:translateX(-50%) scale(1);}

/* === Number Buttons === */
.ngrid{display:flex;gap:12px;margin-top:18px;flex-wrap:wrap;justify-content:center;}
.nb{width:60px;height:60px;border-radius:50%;background:linear-gradient(135deg,var(--p),var(--s));border:2px solid rgba(255,255,255,0.15);color:#fff;font-size:1.3em;font-weight:900;font-family:'Orbitron',sans-serif;cursor:pointer;transition:all .35s cubic-bezier(.175,.885,.32,1.275);display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden;}
.nb::after{content:'';position:absolute;inset:0;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,0.2),transparent);opacity:0;transition:opacity .3s;}
.nb:hover::after{opacity:1;}
.nb:hover{transform:scale(1.15) rotate(8deg);box-shadow:0 0 25px rgba(102,126,234,0.4);border-color:var(--g);}
.nb.sel{background:linear-gradient(135deg,var(--g),#ff8c00);border-color:var(--g);transform:scale(1.1);box-shadow:0 0 35px rgba(255,215,0,0.3);}

/* === Action Button === */
.ab{padding:14px 40px;background:linear-gradient(135deg,var(--p),var(--s));border:none;border-radius:50px;color:#fff;font-size:1.05em;font-weight:700;font-family:'Tajawal',sans-serif;cursor:pointer;transition:all .35s cubic-bezier(.175,.885,.32,1.275);margin-top:22px;position:relative;overflow:hidden;display:inline-flex;align-items:center;gap:8px;}
.ab::before{content:'';position:absolute;top:0;left:-100%;width:100%;height:100%;background:linear-gradient(90deg,transparent,rgba(255,255,255,0.15),transparent);transition:left .5s;}
.ab:hover::before{left:100%;}
.ab:hover{transform:translateY(-4px) scale(1.04);box-shadow:0 12px 35px rgba(102,126,234,0.4);}
.ab:active{transform:translateY(-1px) scale(.98);}
.ab:disabled{opacity:.4;pointer-events:none;}
.ab svg{width:18px;height:18px;fill:#fff;}

/* === Back Button === */
.bb{position:absolute;top:18px;right:18px;padding:8px 16px;background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.1);border-radius:25px;color:#fff;font-family:'Tajawal',sans-serif;font-size:.8em;cursor:pointer;transition:all .3s;z-index:50;display:flex;align-items:center;gap:6px;}
.bb svg{width:14px;height:14px;fill:#fff;}
.bb:hover{background:rgba(255,255,255,0.1);transform:scale(1.05);}

/* === Progress === */
.pw{width:100%;height:6px;background:rgba(255,255,255,0.06);border-radius:3px;margin-bottom:18px;overflow:hidden;}
.pb{height:100%;background:linear-gradient(90deg,var(--p),var(--a),var(--g));border-radius:3px;transition:width .6s cubic-bezier(.175,.885,.32,1.275);position:relative;}
.pb::after{content:'';position:absolute;inset:0;background:linear-gradient(90deg,transparent,rgba(255,255,255,0.3),transparent);animation:pbSh 2s infinite;}
@keyframes pbSh{0%{transform:translateX(-100%);}100%{transform:translateX(100%);}}
.qn{font-family:'Orbitron',sans-serif;font-size:.85em;color:var(--g);margin-bottom:12px;letter-spacing:2px;text-align:center;}

/* === Question === */
.qt{font-size:1.2em;font-weight:700;margin-bottom:18px;line-height:1.8;padding:18px;background:rgba(255,255,255,0.03);border-radius:16px;border:1px solid rgba(255,255,255,0.06);text-align:center;}
.qt small{opacity:.4;font-size:.7em;display:block;margin-top:6px;letter-spacing:1px;}
.sen{font-family:'Poppins',sans-serif;font-size:1.3em;padding:20px;background:rgba(255,255,255,0.03);border-radius:16px;border:1px solid rgba(255,255,255,0.06);margin:12px 0;direction:ltr;text-align:center;line-height:1.8;letter-spacing:.5px;}

/* === Input === */
.ai{width:100%;max-width:480px;padding:14px 20px;background:rgba(255,255,255,0.05);border:2px solid rgba(102,126,234,0.2);border-radius:14px;color:#fff;font-size:1.1em;font-family:'Poppins',sans-serif;text-align:center;transition:all .3s;outline:none;direction:ltr;}
.ai:focus{border-color:var(--g);box-shadow:0 0 25px rgba(255,215,0,0.15);background:rgba(255,255,255,0.08);}
.ai::placeholder{color:rgba(255,255,255,0.2);}

/* === Word Chips === */
.wc{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:12px 0;min-height:55px;padding:12px;background:rgba(255,255,255,0.02);border-radius:14px;border:1px dashed rgba(255,255,255,0.08);}
.ch{padding:9px 16px;background:linear-gradient(135deg,rgba(102,126,234,0.2),rgba(118,75,162,0.2));border:1px solid rgba(102,126,234,0.3);border-radius:10px;cursor:pointer;font-family:'Poppins',sans-serif;font-size:1em;font-weight:600;transition:all .3s;user-select:none;direction:ltr;}
.ch:hover{transform:scale(1.08) rotate(-2deg);box-shadow:0 4px 15px rgba(102,126,234,0.25);border-color:var(--g);}
.ch.pl{background:linear-gradient(135deg,rgba(0,230,118,0.15),rgba(0,200,83,0.15));border-color:var(--ok);}
.dz{min-height:55px;padding:10px;background:rgba(255,215,0,0.03);border:2px dashed rgba(255,215,0,0.2);border-radius:14px;display:flex;flex-wrap:wrap;gap:7px;align-items:center;justify-content:center;margin:12px 0;transition:all .3s;direction:ltr;}
.dz:empty::before{content:'اضغط على الكلمات لترتيبها';color:rgba(255,255,255,0.25);font-size:.85em;}

/* === Options === */
.opts{display:flex;gap:10px;margin-top:15px;flex-wrap:wrap;justify-content:center;}
.op{padding:12px 20px;background:linear-gradient(135deg,rgba(102,126,234,0.12),rgba(118,75,162,0.12));border:2px solid rgba(102,126,234,0.2);border-radius:12px;color:#fff;font-family:'Poppins',sans-serif;font-size:.95em;font-weight:600;cursor:pointer;transition:all .3s cubic-bezier(.175,.885,.32,1.275);direction:ltr;}
.op:hover{transform:scale(1.06);border-color:var(--g);box-shadow:0 0 18px rgba(255,215,0,0.15);}
.op.sel{background:linear-gradient(135deg,var(--g),#ff8c00);border-color:var(--g);color:#000;transform:scale(1.06);}

/* === TF === */
.tf{display:flex;gap:20px;justify-content:center;margin-top:18px;flex-wrap:wrap;}
.tfb{padding:16px 40px;border-radius:14px;font-size:1.1em;font-weight:700;cursor:pointer;transition:all .3s cubic-bezier(.175,.885,.32,1.275);border:2px solid;font-family:'Tajawal',sans-serif;display:flex;align-items:center;gap:8px;}
.tfb svg{width:20px;height:20px;}
.tfb.t{background:rgba(0,230,118,0.1);border-color:rgba(0,230,118,0.3);color:var(--ok);}
.tfb.t svg{fill:var(--ok);}
.tfb.f{background:rgba(255,82,82,0.1);border-color:rgba(255,82,82,0.3);color:var(--er);}
.tfb.f svg{fill:var(--er);}
.tfb:hover{transform:scale(1.08) translateY(-4px);box-shadow:0 10px 25px rgba(0,0,0,0.3);}
.tfb.sel{transform:scale(1.08);box-shadow:0 0 25px currentColor;}

/* === Hint === */
.hb{padding:8px 20px;background:rgba(255,215,0,0.06);border:1px solid rgba(255,215,0,0.2);border-radius:25px;color:var(--g);font-size:.8em;cursor:pointer;transition:all .3s;margin-top:10px;font-family:'Tajawal',sans-serif;display:inline-flex;align-items:center;gap:6px;}
.hb svg{width:14px;height:14px;fill:var(--g);}
.hb:hover{background:rgba(255,215,0,0.12);transform:scale(1.05);box-shadow:0 0 15px rgba(255,215,0,0.15);}
.hx{margin-top:10px;padding:12px 16px;background:rgba(255,215,0,0.05);border-radius:12px;border:1px solid rgba(255,215,0,0.15);font-size:.85em;line-height:1.7;display:none;animation:fadeIn .4s;}
.hx.show{display:block;}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:translateY(0);}}

/* === Results === */
.res{text-align:center;width:100%;}
.sc{width:170px;height:170px;border-radius:50%;background:conic-gradient(var(--ok) var(--p,0%),rgba(255,255,255,0.06) 0%);display:flex;align-items:center;justify-content:center;margin:22px auto;position:relative;animation:scIn 1.5s cubic-bezier(.175,.885,.32,1.275);}
@keyframes scIn{from{transform:scale(0) rotate(-180deg);opacity:0;}to{transform:scale(1) rotate(0);opacity:1;}}
.si{width:145px;height:145px;border-radius:50%;background:rgba(7,7,20,0.95);display:flex;align-items:center;justify-content:center;flex-direction:column;}
.sn{font-family:'Orbitron',sans-serif;font-size:2.3em;font-weight:900;color:var(--g);}
.sl{font-size:.8em;color:rgba(255,255,255,0.5);}
.sts{font-size:2em;margin:12px 0;display:flex;justify-content:center;gap:4px;}
.sts span{display:inline-block;animation:stP 1s infinite alternate;}
.sts span:nth-child(2){animation-delay:.1s;}
.sts span:nth-child(3){animation-delay:.2s;}
.sts span:nth-child(4){animation-delay:.3s;}
.sts span:nth-child(5){animation-delay:.4s;}
@keyframes stP{from{transform:scale(1);}to{transform:scale(1.15);}}
.rm{font-size:1.2em;font-weight:700;margin:10px 0;padding:10px 22px;border-radius:14px;display:inline-block;}
.rm.ex{background:rgba(0,230,118,0.1);color:var(--ok);border:1px solid rgba(0,230,118,0.2);}
.rm.gd{background:rgba(255,215,0,0.1);color:var(--g);border:1px solid rgba(255,215,0,0.2);}
.rm.pr{background:rgba(255,82,82,0.1);color:var(--er);border:1px solid rgba(255,82,82,0.2);}

/* === Review === */
.rv{width:100%;max-height:260px;overflow-y:auto;margin-top:15px;padding:6px;}
.ai2{padding:12px 15px;margin:7px 0;border-radius:12px;display:flex;align-items:center;gap:10px;animation:slIn .4s cubic-bezier(.175,.885,.32,1.275) both;}
@keyframes slIn{from{opacity:0;transform:translateX(15px);}to{opacity:1;transform:translateX(0);}}
.ai2.ok{background:rgba(0,230,118,0.07);border:1px solid rgba(0,230,118,0.15);}
.ai2.no{background:rgba(255,82,82,0.07);border:1px solid rgba(255,82,82,0.15);}
.ai2 .ic2{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.ai2.ok .ic2{background:rgba(0,230,118,0.15);}
.ai2.no .ic2{background:rgba(255,82,82,0.15);}
.ai2 .ic2 svg{width:16px;height:16px;}
.ai2.ok .ic2 svg{fill:var(--ok);}
.ai2.no .ic2 svg{fill:var(--er);}
.ai2 .dt{flex:1;font-size:.85em;direction:ltr;text-align:left;}
.ai2 .ca{color:var(--ok);font-weight:700;}
.ai2 .ua{color:var(--er);text-decoration:line-through;}

/* === Notification === */
.nf{position:fixed;top:18px;left:50%;transform:translateX(-50%) translateY(-100px);padding:12px 25px;border-radius:12px;font-weight:700;z-index:1000;transition:transform .5s cubic-bezier(.175,.885,.32,1.275);backdrop-filter:blur(15px);display:flex;align-items:center;gap:8px;font-size:.9em;}
.nf svg{width:18px;height:18px;}
.nf.show{transform:translateX(-50%) translateY(0);}
.nf.ok{background:rgba(0,230,118,0.15);border:1px solid rgba(0,230,118,0.3);color:var(--ok);}
.nf.ok svg{fill:var(--ok);}
.nf.er{background:rgba(255,82,82,0.15);border:1px solid rgba(255,82,82,0.3);color:var(--er);}
.nf.er svg{fill:var(--er);}

/* === Confetti === */
.cf{position:fixed;top:-10px;z-index:1000;animation:cfF 3s linear forwards;pointer-events:none;}
@keyframes cfF{0%{transform:translateY(-10px) rotate(0);opacity:1;}100%{transform:translateY(100vh) rotate(720deg);opacity:0;}}

/* === Ripple === */
.rp{position:absolute;border-radius:50%;background:rgba(255,255,255,0.2);transform:scale(0);animation:rpE .6s linear;pointer-events:none;}
@keyframes rpE{to{transform:scale(4);opacity:0;}}

/* === Screen === */
.scr{display:none;animation:cardIn .6s cubic-bezier(.175,.885,.32,1.275);}
.scr.act{display:block;}

/* === Steps indicator === */
.steps{display:flex;justify-content:center;gap:8px;margin-bottom:20px;}
.step{width:8px;height:8px;border-radius:50%;background:rgba(255,255,255,0.15);transition:all .3s;}
.step.act{background:var(--g);box-shadow:0 0 10px rgba(255,215,0,0.3);transform:scale(1.3);}
.step.done{background:var(--ok);}

/* === Responsive === */
@media(max-width:768px){
.ttl{font-size:1.4em;}
.card{padding:20px;border-radius:20px;}
.grid{grid-template-columns:1fr 1fr;gap:10px;}
.b{padding:16px 10px;font-size:.85em;}
.b .ic{width:36px;height:36px;padding:6px;}
.b .ic svg{width:22px;height:22px;}
.qt{font-size:1em;padding:14px;}
.sen{font-size:1.1em;padding:14px;}
}
@media(max-width:400px){
.grid{grid-template-columns:1fr;}
}
</style>
</head>
<body>

<div class="bg" id="bg">
<div class="grid-lines"></div>
</div>

<div class="nf" id="nf">
<svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 15l-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-9 9z"/></svg>
<span id="nfT"></span>
</div>

<div class="app">

<!-- Screen 1: State -->
<div class="scr act" id="s1">
<div class="card">
<h1 class="ttl">Grammar Master Pro</h1>
<p class="sub">Simple Present Tense</p>

<div class="steps"><div class="step act"></div><div class="step"></div><div class="step"></div><div class="step"></div></div>

<div class="sec">
<svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 15l-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-9 9z"/></svg>
<span>اختر نوع الحالة</span>
</div>

// ===== Navigation =====
function go(id){
document.querySelectorAll('.scr').forEach(s=>s.classList.remove('act'));
document.getElementById(id).classList.add('act');
}

// ===== Selections =====
function pick(key,val,el){
S[key]=val;
el.parentElement.querySelectorAll('.b').forEach(b=>b.classList.remove('sel'));
el.classList.add('sel');
const names={state:{pos:'✅ الإثبات',neg:'❌ النفي',q:'❓ السؤال'},diff:{easy:'بسيط',med:'متوسط',hard:'صعب'},type:{puzzle:'🧩 لغز',fill:'✏️ فراغ',rearrange:'🔄 ترتيب',rewrite:'📝 إعادة صياغة',tf:'✅ صح/خطأ'}};
notify(names[key][val]+' ✓','ok');
setTimeout(()=>{
if(key==='state')go('s2');
else if(key==='diff')go('s3');
else if(key==='type')go('s4');
},500);
}

function pickNum(n){
S.num=n;
document.querySelectorAll('.nb').forEach(b=>b.classList.remove('sel'));
event.target.classList.add('sel');
document.getElementById('stBtn').disabled=false;
}

// ===== Quiz =====
function startQ(){
if(!S.num)return;
S.cur=0;S.score=0;S.ans=[];S.placed=[];
const bank=B[S.state][S.diff][S.type];
S.qs=shuffle([...bank]).slice(0,S.num);
go('s5');
loadQ();
}

function loadQ(){
document.getElementById('hBox').classList.remove('show');
const q=S.qs[S.cur];
const prog=(S.cur/S.num)*100;
document.getElementById('pBar').style.width=prog+'%';
document.getElementById('qNum').textContent=`Question ${S.cur+1} / ${S.num}`;
document.getElementById('qBox').innerHTML='';
S.placed=[];

switch(S.type){
case 'puzzle':loadPuzzle(q);break;
case 'fill':loadFill(q);break;
case 'rearrange':loadRearrange(q);break;
case 'rewrite':loadRewrite(q);break;
case 'tf':loadTF(q);break;
}
}

function loadPuzzle(q){
const sh=shuffle([...q.w]);
document.getElementById('qBox').innerHTML=`
<div class="qt">رتب الكلمات لتكوين جملة صحيحة<small>Arrange the words</small></div>
<div class="wc" id="src">${sh.map(w=>`<div class="ch" onclick="mvCh(this)">${w}</div>`).join('')}</div>
<div class="dz" id="dst" onclick="rmLast()"></div>
<input type="hidden" id="pAns">`;
updP();
}

function mvCh(c){
const src=document.getElementById('src'),dst=document.getElementById('dst');
if(c.parentElement===src){c.classList.add('pl');dst.appendChild(c);S.placed.push(c.textContent);}
updP();
}
function rmLast(){
const dst=document.getElementById('dst');
const chs=dst.querySelectorAll('.ch');
if(chs.length){const l=chs[chs.length-1];l.classList.remove('pl');document.getElementById('src').appendChild(l);S.placed.pop();updP();}
}
function updP(){document.getElementById('pAns').value=S.placed.join(' ');}

function loadFill(q){
document.getElementById('qBox').innerHTML=`
<div class="qt">املأ الفراغ بالكلمة الصحيحة<small>Fill in the blank</small></div>
<div class="sen">${q.s}</div>
<input type="text" class="ai" id="fAns" placeholder="اكتب الإجابة هنا..." autocomplete="off" dir="ltr">`;
setTimeout(()=>document.getElementById('fAns').focus(),300);
}

function loadRearrange(q){
document.getElementById('qBox').innerHTML=`
<div class="qt">أعد ترتيب الكلمات واكتب الجملة<small>Rearrange and write</small></div>
<div class="sen" style="color:var(--a);">${q.sc}</div>
<input type="text" class="ai" id="rAns" placeholder="اكتب الجملة المرتبة..." autocomplete="off" dir="ltr" style="max-width:100%;">`;
setTimeout(()=>document.getElementById('rAns').focus(),300);
}

function loadRewrite(q){
document.getElementById('qBox').innerHTML=`
<div class="qt">أعد صياغة الجملة حسب المطلوب<small>Rewrite as instructed</small></div>
<div class="sen" style="color:var(--a);font-size:1.1em;">${q.q}</div>
<input type="text" class="ai" id="wAns" placeholder="اكتب الجملة الجديدة..." autocomplete="off" dir="ltr" style="max-width:100%;">`;
setTimeout(()=>document.getElementById('wAns').focus(),300);
}

function loadTF(q){

<div class="qt">هل الجملة صحيحة أم خاطئة؟<small>True or False?</small></div>

<div class="tf">

</button>

function pickTF(el,v){

// ===== Hint =====
function showH(){
const q=S.qs[S.cur];
const h=document.getElementById('hBox');
h.innerHTML='💡 '+q.h;
h.classList.add('show');
notify('💡 تلميح','ok');
}

// ===== Submit =====
function subAns(){
const q=S.qs[S.cur];
let ua='',ok=false;
switch(S.type){
case 'puzzle':
ua=document.getElementById('pAns').value.trim();
ok=norm(ua)===norm(q.a);break;
case 'fill':
ua=document.getElementById('fAns').value.trim();
ok=norm(ua)===norm(q.a);break;
case 'rearrange':
ua=document.getElementById('rAns').value.trim();
ok=norm(ua)===norm(q.a);break;
case 'rewrite':
ua=document.getElementById('wAns').value.trim();
ok=norm(ua)===norm(q.a);break;
case 'tf':
ua=document.getElementById('tAns').value;
ok=ua===String(q.c);break;
}
if(!ua&&ua!==false&&ua!=='false'){notify('⚠️ أدخل إجابة','er');return;}
if(ok)S.score++;
S.ans.push({q:getQD(q),ua:ua||'(لا شيء)',ca:getCD(q),ok:ok});
if(ok){notify('✅ إجابة صحيحة','ok');miniCf();}
else notify('❌ إجابة خاطئة','er');
setTimeout(()=>{
S.cur++;
if(S.cur<S.num){S.placed=[];loadQ();}
else showRes();
},1400);
}

function getQD(q){
if(S.type==='puzzle')return q.w.join(' ');
if(S.type==='rearrange')return q.sc;
if(S.type==='rewrite')return q.q;
return q.s;
}
function getCD(q){
if(S.type==='puzzle')return q.a;
if(S.type==='fill')return q.a;
if(S.type==='rearrange')return q.a;
if(S.type==='rewrite')return q.a;
if(S.type==='tf')return q.c?'True ✓':'False ✗ ('+q.co+')';
}
function norm(s){return s.toLowerCase().replace(/\s+/g,' ').replace(/\s*([.,?!])/g,'$1').replace(/['']/g,"'").trim();}

// ===== Results =====
function showRes(){
go('s6');
const p=Math.round((S.score/S.num)*100);
document.getElementById('pBar').style.width='100%';
setTimeout(()=>{
document.getElementById('scC').style.setProperty('--p',p+'%');
document.getElementById('scN').textContent=p+'%';
},300);
let stars='',msg='',cls='';
const starSvg='<svg width="28" height="28" viewBox="0 0 24 24" fill="#ffd700"><path d="M12 17.27L18.18 21l-1.64-7.03L22 9.24l-7.19-.61L12 2 9.19 8.63 2 9.24l5.46 4.73L5.82 21z"/></svg>';
const emptyStar='<svg width="28" height="28" viewBox="0 0 24 24" fill="rgba(255,255,255,0.15)"><path d="M12 17.27L18.18 21l-1.64-7.03L22 9.24l-7.19-.61L12 2 9.19 8.63 2 9.24l5.46 4.73L5.82 21z"/></svg>';
let starCount=0;
if(p>=90){starCount=5;msg='🏆 ممتاز! أنت نجم!';cls='ex';conf();}
else if(p>=70){starCount=4;msg='👏 جيد جداً!';cls='ex';}
else if(p>=50){starCount=3;msg='👍 جيد!';cls='gd';}
else if(p>=30){starCount=2;msg='📚 تحتاج مراجعة';cls='pr';}
else{starCount=1;msg='💪 حاول مرة أخرى';cls='pr';}
let starsHtml='';
for(let i=0;i<5;i++)starsHtml+=i<starCount?starSvg:emptyStar;
document.getElementById('sts').innerHTML=starsHtml;
const rm=document.getElementById('rm');
rm.textContent=msg;rm.className='rm '+cls;
const rv=document.getElementById('rv');
rv.innerHTML='<div class="sec" style="justify-content:center;"><svg viewBox="0 0 24 24"><path d="M14 2H6c-1.1 0-2 .9-2 2v16c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V8l-6-6z"/></svg><span>مراجعة الإجابات</span></div>';
S.ans.forEach((a,i)=>{
const it=document.createElement('div');
it.className='ai2 '+(a.ok?'ok':'no');
it.style.animationDelay=(i*0.12)+'s';
const checkSvg='<svg viewBox="0 0 24 24"><path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/></svg>';
const xSvg='<svg viewBox="0 0 24 24"><path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg>';
it.innerHTML=`<div class="ic2">${a.ok?checkSvg:xSvg}</div>
<div class="dt">
<div style="margin-bottom:4px;"><b>Q${i+1}:</b> ${a.q}</div>
<div>إجابتك: <span class="${a.ok?'ca':'ua'}">${a.ua}</span></div>
${!a.ok?`<div>الصحيحة: <span class="ca">${a.ca}</span></div>`:''}
</div>`;
rv.appendChild(it);
});
}

// ===== Utils =====
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}

function reset(){
S={state:'',diff:'',type:'',num:0,cur:0,score:0,qs:[],ans:[],placed:[]};
document.querySelectorAll('.nb').forEach(b=>b.classList.remove('sel'));
document.querySelectorAll('.b').forEach(b=>b.classList.remove('sel'));
document.getElementById('stBtn').disabled=true;
}

function restart(){
S.cur=0;S.score=0;S.ans=[];S.placed=[];
const bank=B[S.state][S.diff][S.type];
S.qs=shuffle([...bank]).slice(0,S.num);
go('s5');loadQ();
}

function notify(m,t){

document.getElementById('nfT').textContent=m;
n.className='nf '+t+' show';
setTimeout(()=>n.classList.remove('show'),2200);
}

function conf(){
const c=['#ffd700','#f093fb','#667eea','#00e676','#ff5252','#00bcd4'];
for(let i=0;i<50;i++){
setTimeout(()=>{
const d=document.createElement('div');d.className='cf';
d.style.left=Math.random()*100+'vw';

}

function miniCf(){
const c=['#00e676','#ffd700','#667eea'];
for(let i=0;i<10;i++){
setTimeout(()=>{
const d=document.createElement('div');d.className='cf';
d.style.left=(40+Math.random()*20)+'vw';

// ===== Ripple =====
document.addEventListener('click',e=>{
const b=e.target.closest('.b,.nb,.ab,.tfb,.hb,.bb,.op,.ch');
if(!b)return;
const r=document.createElement('span');r.className='rp';
const rect=b.getBoundingClientRect();
const sz=Math.max(rect.width,rect.height);
r.style.width=r.style.height=sz+'px';
r.style.left=(e.clientX-rect.left-sz/2)+'px';
r.style.top=(e.clientY-rect.top-sz/2)+'px';
b.style.position='relative';b.style.overflow='hidden';
b.appendChild(r);
setTimeout(()=>r.remove(),600);
});

// ===== Enter Key =====
document.addEventListener('keydown',e=>{
if(e.key==='Enter'){
const q=document.getElementById('s5');
if(q.classList.contains('act'))subAns();
}
});

// ===== Prevent context menu =====
document.addEventListener('contextmenu',e=>e.preventDefault());

// ===== Prevent drag =====
document.addEventListener('dragstart',e=>e.preventDefault());

// ===== Entrance animation =====
setTimeout(()=>{
document.querySelectorAll('#s1 .b').forEach((b,i)=>{
b.style.opacity='0';b.style.transform='translateY(25px)';
setTimeout(()=>{
b.style.transition='all .5s cubic-bezier(.175,.885,.32,1.275)';
b.style.opacity='1';b.style.transform='translateY(0)';
},i*100+200);
});
},100);
</script>
